name: Dependabot Auto-Merge

# Arms GitHub's auto-merge on Dependabot PRs whose full check suite is green.
#
# NOTE on Sonar coverage for dependabot bumps: PR-time scans are skipped for
# dependabot PRs by the author guard in sonarcloud.yml (issue #1189), and
# merging with GITHUB_TOKEN (as github-actions bot) does not trigger the
# post-merge main-branch Sonar run either. Accepted trade-off: routine
# vetted dependency bumps get NO Sonar analysis; if a specific bump needs
# it, update the branch manually (human actor) to force a full run.

# Intentionally scoped: only PRs authored by dependabot[bot] on dependabot/*
# branches. The scan step in sonarcloud.yml is author-gated to skip on
# dependabot PRs (issue #1189), so "SonarCloud Code Analysis" — emitted by
# the SonarCloud app only when a scan runs — never reports here; the
# 'main' ruleset bypasses dependabot-authored pushes for exactly that
# reason. This workflow is therefore the de facto merge gate: it asserts
# the required checks itself before arming auto-merge, never relying on
# the ruleset (which enforces nothing for this actor).

on:
 pull_request_target:
  types: [opened, synchronize]

permissions:
 contents: write
 pull-requests: write

jobs:
 automerge:
  runs-on: ubuntu-latest
  if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/')
  steps:
   - name: Fetch Dependabot metadata
     id: metadata
     uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2
     with:
      github-token: "${{ secrets.GITHUB_TOKEN }}"

   # Only go-module dependency bumps — an explicit safety check (the
   # repo's dependabot.yml only configures gomod today, but this holds
   # even if other ecosystems are added later). fetch-metadata names
   # the ecosystem after the branch token: go_modules.
   - name: Restrict to go.mod bumps
     run: |
      set -euo pipefail
      case "${{ steps.metadata.outputs.package-ecosystem }}" in
        go_modules) echo "eligible: go.mod bump";;
        *) echo "::error::Not a go.mod bump (ecosystem: '${{ steps.metadata.outputs.package-ecosystem }}') — not arming auto-merge."; exit 1;;
      esac

   # Per gate name, take the LATEST check-run on the head SHA and
   # require it to exist AND be success. A missing gate fails (no
   # vacuous pass); a stale superseded attempt is ignored because only
   # the latest attempt per name is consulted.
   - name: Require curated gate suite green on head
     timeout-minutes: 30
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      set -euo pipefail
      sha="${{ github.event.pull_request.head.sha }}"
      gates=(sonarcloud lint test build-tests generate-matrix opengrep e2e CodeQL \
             "Build and Release Go Binary (darwin, amd64)" \
             "Build and Release Go Binary (darwin, arm64)" \
             "Build and Release Go Binary (linux, amd64)" \
             "Build and Release Go Binary (linux, arm64)")
      deadline=$(( $(date +%s) + 1500 ))
      while true; do
        # No error masking: a token/API failure must fail the step loudly,
        # not look like all gates are missing.
        results=$(gh api "repos/${{ github.repository }}/commits/${sha}/check-runs?per_page=100" \
          --jq '[.check_runs[]] | group_by(.name) | map(max_by(.started_at) | {name, status, conclusion})')
        pending=$(echo "$results" | jq '[.[] | select(.status != "COMPLETED")] | length')
        missing=""
        failed=""
        for gate in "${gates[@]}"; do
          latest=$(echo "$results" | jq -r --arg g "$gate" '[.[] | select(.name == $g)][0] | .status // "missing"' 2>/dev/null)
          if [ "$latest" = "missing" ]; then missing="$missing $gate"; continue; fi
          conc=$(echo "$results" | jq -r --arg g "$gate" '[.[] | select(.name == $g)][0] | .conclusion // "none"' 2>/dev/null)
          if [ "$conc" != "success" ]; then failed="$failed $gate($conc)"; fi
        done
        if [ -z "$missing" ] && [ -z "$failed" ] && { [ -z "$pending" ] || [ "$pending" = "0" ]; }; then
          echo "All ${#gates[@]} gates green on ${sha}."
          break
        fi
        [ -n "$missing" ] && echo "Waiting for (absent):$missing"
        [ -n "$failed" ] && echo "Non-success (latest attempt):$failed"
        echo "Pending check-runs: ${pending}"
        if [ "$(date +%s)" -ge "$deadline" ]; then
          echo "::error::Timed out after 40m waiting for gates. missing:[$missing] failed:[$failed]"
          exit 1
        fi
        sleep 60
      done

   - name: Arm auto-merge
     run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
