# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # connectrpc.com/vanguard 0.5.0 is a rewrite onto connect-go v2: every API
    # this repo uses (Service, NewTranscoder, ServiceOption, WithTargetProtocols,
    # WithTargetCodecs, WithUnknownHandler) was removed, so the bump cannot
    # compile (see #1375). Migrating is tracked in #1379; until that lands, do
    # not re-file the bump every week. Remove this rule with that migration.
    ignore:
      - dependency-name: "connectrpc.com/vanguard"
        versions:
          - ">= 0.5.0"
