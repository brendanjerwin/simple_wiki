# CodeFactor configuration.
#
# CodeFactor's bundled eslint does not honor the project's
# static/js/.eslintrc.js overrides (the test-file block that turns off
# '@typescript-eslint/no-unused-expressions' because chai's
# expect(x).to.be.true idiom is an expression, not a mistake). Reported
# false positives on PR #1284/#1286 were exclusively that rule in
# *.test.ts files, so the exclusion lives here.
#
# NOTE: top-level exclude_patterns only (per CodeFactor docs); the
# invalid `tools[].excluded_paths` key previously written here was
# ignored by the analyzer, which is why the 23/1 findings still fired.

exclude_patterns:
  - "static/js/gen/**"
  - "gen/**"
  - "vendor/**"
  - "static/js/**/*.test.ts"
  - "static/js/**/*.stories.ts"