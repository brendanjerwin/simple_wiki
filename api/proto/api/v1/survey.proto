syntax = "proto3";

package api.v1;

import "api/v1/mcp_options.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/brendanjerwin/simple_wiki/gen/go/api/v1;apiv1";

// SurveyService owns the wiki.surveys.<name> frontmatter namespace.
//
// Generic Frontmatter writes to wiki.* are rejected so response arrays are
// not clobbered by stale read/replace cycles. Use this service for survey
// configuration and user response writes.
service SurveyService {
  option (api.v1.service_description) =
      "Owns the wiki.surveys.<name> frontmatter namespace: survey "
      "configuration (question + fields) and user response writes. Generic "
      "Frontmatter writes to wiki.* are rejected so response arrays are not "
      "clobbered by stale read/replace cycles. Use this service for all "
      "survey configuration and response writes.";

  rpc GetSurvey(GetSurveyRequest) returns (GetSurveyResponse) {
    option (api.v1.description) =
        "Read a survey's configuration (question, fields, closed flag) and "
        "its responses. Does not include response values in the summary "
        "form — use ListResponses for raw response data.";
    option (api.v1.read_only) = true;
  }

  rpc UpsertSurvey(UpsertSurveyRequest) returns (UpsertSurveyResponse) {
    option (api.v1.description) =
        "Create or replace a survey's question and closed flag on a page. "
        "Does not touch fields or responses — use AddField/UpdateField/"
        "RemoveField for field edits and SubmitResponse/DeleteResponse for "
        "response writes. Pass expected_updated_at for optimistic "
        "concurrency.";
  }

  rpc AddField(AddSurveyFieldRequest) returns (AddSurveyFieldResponse) {
    option (api.v1.description) =
        "Append a new SurveyField (name, type, label, options, required, "
        "min/max) to an existing survey. Field names must be unique within "
        "the survey.";
  }

  rpc UpdateField(UpdateSurveyFieldRequest) returns (UpdateSurveyFieldResponse) {
    option (api.v1.description) =
        "Replace an existing SurveyField identified by field_name. The "
        "field's name can be changed by setting a new name in the supplied "
        "field. Pass expected_updated_at for optimistic concurrency.";
  }

  rpc RemoveField(RemoveSurveyFieldRequest) returns (RemoveSurveyFieldResponse) {
    option (api.v1.description) =
        "Remove a SurveyField by name from a survey. Existing responses "
        "that supplied a value for the removed field are left as-is. Pass "
        "expected_updated_at for optimistic concurrency.";
  }

  rpc ReorderField(ReorderSurveyFieldRequest) returns (ReorderSurveyFieldResponse) {
    option (api.v1.description) =
        "Move a SurveyField to new_index (zero-based) within the fields "
        "array. Other fields shift to fill the gap. Pass "
        "expected_updated_at for optimistic concurrency.";
  }

  rpc SubmitResponse(SubmitSurveyResponseRequest) returns (SubmitSurveyResponseResponse) {
    option (api.v1.description) =
        "Submit one response to a survey. values is a Struct keyed by "
        "field name. Set anonymous=true to omit the caller's identity from "
        "the stored response. Has no effect on a closed survey.";
  }

  rpc ListResponses(ListSurveyResponsesRequest) returns (ListSurveyResponsesResponse) {
    option (api.v1.description) =
        "List all responses submitted to a survey, each with user, "
        "anonymous flag, submitted_at, and the Struct of field values.";
    option (api.v1.read_only) = true;
  }

  rpc DeleteResponse(DeleteSurveyResponseRequest) returns (DeleteSurveyResponseResponse) {
    option (api.v1.description) =
        "Delete one response identified by user + submitted_at. Pass "
        "expected_updated_at for optimistic concurrency. Use to retract a "
        "response on a user's behalf.";
  }
}

message Survey {
  string name = 1;
  string question = 2;
  repeated SurveyField fields = 3;
  repeated SurveyResponse responses = 4;
  bool closed = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message SurveyField {
  string name = 1;
  string type = 2;
  optional string label = 3;
  optional bool required = 4;
  repeated string options = 5;
  optional double min = 6;
  optional double max = 7;
}

message SurveyResponse {
  string user = 1;
  bool anonymous = 2;
  google.protobuf.Timestamp submitted_at = 3;
  google.protobuf.Struct values = 4;
}

message GetSurveyRequest {
  string page = 1;
  string name = 2;
}

message GetSurveyResponse {
  Survey survey = 1;
}

message UpsertSurveyRequest {
  string page = 1;
  string name = 2;
  string question = 3;
  optional bool closed = 4;
  google.protobuf.Timestamp expected_updated_at = 5;
}

message UpsertSurveyResponse {
  Survey survey = 1;
}

message AddSurveyFieldRequest {
  string page = 1;
  string name = 2;
  SurveyField field = 3;
  google.protobuf.Timestamp expected_updated_at = 4;
}

message AddSurveyFieldResponse {
  Survey survey = 1;
}

message UpdateSurveyFieldRequest {
  string page = 1;
  string name = 2;
  string field_name = 3;
  SurveyField field = 4;
  google.protobuf.Timestamp expected_updated_at = 5;
}

message UpdateSurveyFieldResponse {
  Survey survey = 1;
}

message RemoveSurveyFieldRequest {
  string page = 1;
  string name = 2;
  string field_name = 3;
  google.protobuf.Timestamp expected_updated_at = 4;
}

message RemoveSurveyFieldResponse {
  Survey survey = 1;
}

message ReorderSurveyFieldRequest {
  string page = 1;
  string name = 2;
  string field_name = 3;
  int32 new_index = 4;
  google.protobuf.Timestamp expected_updated_at = 5;
}

message ReorderSurveyFieldResponse {
  Survey survey = 1;
}

message SubmitSurveyResponseRequest {
  string page = 1;
  string name = 2;
  google.protobuf.Struct values = 3;
  bool anonymous = 4;
}

message SubmitSurveyResponseResponse {
  Survey survey = 1;
}

message ListSurveyResponsesRequest {
  string page = 1;
  string name = 2;
}

message ListSurveyResponsesResponse {
  repeated SurveyResponse responses = 1;
}

message DeleteSurveyResponseRequest {
  string page = 1;
  string name = 2;
  string user = 3;
  google.protobuf.Timestamp submitted_at = 4;
  google.protobuf.Timestamp expected_updated_at = 5;
}

message DeleteSurveyResponseResponse {
  Survey survey = 1;
}
