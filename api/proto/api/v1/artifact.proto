syntax = "proto3";

package api.v1;

import "api/v1/mcp_options.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/brendanjerwin/simple_wiki/gen/go/api/v1;apiv1";

// ArtifactService — see (api.v1.service_description).
service ArtifactService {
  option (api.v1.service_description) =
      "Agent-authored artifact apps on wiki pages. A page's markdown body "
      "carries one ```wiki-artifact fenced block holding an OpenUI Lang "
      "program; the wiki renders it above the page's prose with its own "
      "component library. SetArtifact is the single write door (optimistic "
      "concurrency via expected_version_hash); WatchArtifact streams program "
      "changes for hot-swap. Artifact state lives in "
      "ArtifactStateService.";

  // GetArtifact — see (api.v1.description).
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse) {
    option (api.v1.description) =
        "Reads the artifact program and its stamps from a page's "
        "```wiki-artifact fence. Returns an error (NotFound) when the page "
        "carries no artifact fence.";
    option (api.v1.read_only) = true;
    option (api.v1.example_request) = '{"page": "my-tracker"}';
  }

  // SetArtifact — see (api.v1.description).
  rpc SetArtifact(SetArtifactRequest) returns (SetArtifactResponse) {
    option (api.v1.description) =
        "The ONLY write for an artifact program. Replaces (or creates) the "
        "```wiki-artifact fence on the page. The server validates the "
        "program (conservative structural checks), applies the placement "
        "guard, and stamps wiki.artifact frontmatter (lang, version, "
        "version_hash, library, updated_at/by, automated). OCC: supply "
        "expected_version_hash from a prior GetArtifact/SetArtifact; an "
        "Aborted error means another writer moved first — refetch and "
        "retry. Setting confirm_replace_content=true acknowledges that a "
        "substantial prose body will be removed when the artifact should "
        "stand alone on the page.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "source": "@Card {\\n  Text [\"hi\"]\\n}", '
        '"expected_version_hash": "sha256:abc123"}';
  }

  // ClearArtifact — see (api.v1.description).
  rpc ClearArtifact(ClearArtifactRequest) returns (ClearArtifactResponse) {
    option (api.v1.description) =
        "Removes the artifact fence and wiki.artifact frontmatter subtree "
        "from a page, leaving the page's prose untouched. The page becomes "
        "a plain markdown page. OCC via expected_version_hash as with "
        "SetArtifact.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "expected_version_hash": "sha256:abc123"}';
  }

  // WatchArtifact — see (api.v1.description).
  rpc WatchArtifact(WatchArtifactRequest) returns (stream WatchArtifactResponse) {
    option (api.v1.description) =
        "Server-streaming watch on a page's artifact program. Emits the "
        "current program and hashes on subscribe, then a new event on every "
        "accepted SetArtifact/ClearArtifact — drives the in-page renderer's "
        "hot-swap without a page reload. Not exposed as an MCP tool (the "
        "request/response tool model has no representation for an open "
        "stream); it remains available on the gRPC and Connect surfaces.";
  }
}

// ArtifactStateService — see (api.v1.service_description).
service ArtifactStateService {
  option (api.v1.service_description) =
      "Persistent, cross-device state for page artifacts, stored under the "
      "wiki.artifact_state reserved frontmatter subtree. CAS'd via "
      "state_expected_version_hash (independent of the page's markdown "
      "version hash); watchable for live updates. This is the ONLY way an "
      "artifact app persists state — browser localStorage is not a state "
      "path (it collides across artifacts and is per-device).";

  // GetArtifactState — see (api.v1.description).
  rpc GetArtifactState(GetArtifactStateRequest) returns (GetArtifactStateResponse) {
    option (api.v1.description) =
        "Reads an artifact page's persisted state. Returns an empty state "
        "and empty hash when the artifact has never persisted anything.";
    option (api.v1.read_only) = true;
    option (api.v1.example_request) = '{"page": "pomodoro"}';
  }

  // MergeArtifactState — see (api.v1.description).
  rpc MergeArtifactState(MergeArtifactStateRequest) returns (MergeArtifactStateResponse) {
    option (api.v1.description) =
        "Deep-merges a partial state update into the artifact's persisted "
        "state. CAS: supply state_expected_version_hash from a prior "
        "GetState/MergeState/WatchState; an Aborted error means another "
        "writer moved first — refetch, re-apply, retry. Arrays are unioned, "
        "scalars replaced, nested structs deep-merged.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "state": {"completed_sessions": 3}, '
        '"state_expected_version_hash": "sha256:def456"}';
  }

  // DeleteArtifactState — see (api.v1.description).
  rpc DeleteArtifactState(DeleteArtifactStateRequest) returns (DeleteArtifactStateResponse) {
    option (api.v1.description) =
        "Deletes an artifact page's persisted state entirely (a reset). "
        "CAS: supply state_expected_version_hash from a prior read/watch.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "state_expected_version_hash": "sha256:def456"}';
  }

  // WatchArtifactState — see (api.v1.description).
  rpc WatchArtifactState(WatchArtifactStateRequest) returns (stream WatchArtifactStateResponse) {
    option (api.v1.description) =
        "Server-streaming watch on an artifact's state. Emits the current "
        "state on subscribe, then a new event on every accepted merge or "
        "delete. Not exposed as an MCP tool (streaming); remains available "
        "on the gRPC and Connect surfaces.";
  }
}

// Request to read an artifact program.
message GetArtifactRequest {
  // The page whose artifact to read.
  string page = 1;
}

// Response containing an artifact program and its server-stamped metadata.
message GetArtifactResponse {
  // The OpenUI Lang program source (the fence content, verbatim).
  string source = 1;
  // Server-stamped language: always "openui-lang" in this scope.
  string lang = 2;
  // Server-stamped per-accepted-write revision counter.
  int64 version = 3;
  // Hash of the program; the OCC handle for SetArtifact/ClearArtifact.
  string version_hash = 4;
  // The wiki component library version the program targets (e.g. "wiki-core@1").
  string library = 5;
  // When the artifact was last written.
  google.protobuf.Timestamp updated_at = 6;
  // Who last wrote the artifact.
  string updated_by = 7;
  // Whether the last write was by an automated agent.
  bool automated = 8;
}

// Request to write an artifact program (the single write door).
message SetArtifactRequest {
  // The page whose artifact to set.
  string page = 1;
  // The OpenUI Lang program source. Stored verbatim as the fence content.
  string source = 2;
  // OCC handle from a prior GetArtifact/SetArtifact. Empty on first write
  // to a page without an artifact. Aborted on conflict.
  string expected_version_hash = 3;
  // Acknowledge removing substantial page prose so the artifact can stand
  // alone. Required by the placement guard when the write would drop more
  // than 10% of at least 1KB of prose; see the error message for alternatives.
  bool confirm_replace_content = 4;
}

// Response from an artifact write.
message SetArtifactResponse {
  // New server-stamped version.
  int64 version = 1;
  // New program hash; the OCC handle for the next write.
  string version_hash = 2;
  // The library version stamped on the artifact.
  string library = 3;
}

// Request to remove an artifact (and only the artifact — prose stays).
message ClearArtifactRequest {
  // The page whose artifact to remove.
  string page = 1;
  // OCC handle from a prior GetArtifact/SetArtifact. Aborted on conflict.
  string expected_version_hash = 2;
}

// Response from removing an artifact.
message ClearArtifactResponse {}

// Request to watch an artifact program.
message WatchArtifactRequest {
  // The page whose artifact to watch.
  string page = 1;
}

// An artifact change event.
message WatchArtifactResponse {
  enum Kind {
    // The state as it exists at subscribe time (initial snapshot).
    KIND_UNSPECIFIED = 0;
    // Initial snapshot on subscribe.
    INITIAL = 1;
    // The artifact program changed (SetArtifact).
    UPDATED = 2;
    // The artifact was removed (ClearArtifact).
    CLEARED = 3;
  }
  Kind kind = 1;
  // The program source after the change (empty for CLEARED).
  string source = 2;
  // The program's version after the change.
  int64 version = 3;
  // The program's hash after the change (the OCC handle).
  string version_hash = 4;
}

// Request to read artifact state.
message GetArtifactStateRequest {
  // The artifact page whose state to read.
  string page = 1;
}

// Response containing artifact state.
message GetArtifactStateResponse {
  // The persisted state struct (empty when never persisted).
  google.protobuf.Struct state = 1;
  // Hash of the state; the OCC handle for MergeState/DeleteState.
  string state_version_hash = 2;
}

// Request to merge partial state into an artifact's persisted state.
message MergeArtifactStateRequest {
  // The artifact page whose state to merge into.
  string page = 1;
  // The partial state to deep-merge (arrays union, scalars replace).
  google.protobuf.Struct state = 2;
  // OCC handle from a prior GetState/MergeState/WatchState. Required.
  string state_expected_version_hash = 3;
}

// Response from a state merge.
message MergeArtifactStateResponse {
  // The full merged state.
  google.protobuf.Struct state = 1;
  // New state hash; the OCC handle for the next write.
  string state_version_hash = 2;
}

// Request to delete an artifact's persisted state.
message DeleteArtifactStateRequest {
  // The artifact page whose state to delete.
  string page = 1;
  // OCC handle from a prior read/watch. Required.
  string state_expected_version_hash = 2;
}

// Response from a state delete.
message DeleteArtifactStateResponse {}

// Request to watch artifact state.
message WatchArtifactStateRequest {
  // The artifact page whose state to watch.
  string page = 1;
}

// An artifact state change event.
message WatchArtifactStateResponse {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Initial snapshot on subscribe.
    INITIAL = 1;
    // State changed (MergeState).
    MERGED = 2;
    // State deleted (DeleteState).
    DELETED = 3;
  }
  Kind kind = 1;
  // The state after the change (empty for DELETED).
  google.protobuf.Struct state = 2;
  // The state hash after the change (the OCC handle).
  string state_version_hash = 3;
}