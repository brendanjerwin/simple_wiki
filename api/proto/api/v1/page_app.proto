syntax = "proto3";

package api.v1;

import "api/v1/mcp_options.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/brendanjerwin/simple_wiki/gen/go/api/v1;apiv1";

// PageAppService — see (api.v1.service_description).
service PageAppService {
  option (api.v1.service_description) =
      "Agent-authored page apps on wiki pages. A page's markdown body "
      "carries one ```wiki-page-app fenced block holding an OpenUI Lang "
      "program; the wiki renders it above the page's prose with its own "
      "component library. SetPageApp is the single write door (optimistic "
      "concurrency via expected_version_hash); WatchPageApp streams program "
      "changes for hot-swap. Artifact state lives in "
      "PageAppStateService.";

  // GetPageApp — see (api.v1.description).
  rpc GetPageApp(GetPageAppRequest) returns (GetPageAppResponse) {
    option (api.v1.description) =
        "Reads the page app program and its stamps from a page's "
        "```wiki-page-app fence. Returns an error (NotFound) when the page "
        "carries no page-app fence.";
    option (api.v1.read_only) = true;
    option (api.v1.example_request) = '{"page": "my-tracker"}';
  }

  // SetPageApp — see (api.v1.description).
  rpc SetPageApp(SetPageAppRequest) returns (SetPageAppResponse) {
    option (api.v1.description) =
        "The ONLY write for a page app program. Replaces (or creates) the "
        "```wiki-page-app fence on the page. The server validates the "
        "program (conservative structural checks), applies the placement "
        "guard, and stamps wiki.page_app frontmatter (lang, version, "
        "version_hash, library, updated_at/by, automated). OCC: supply "
        "expected_version_hash from a prior GetPageApp/SetPageApp; an "
        "Aborted error means another writer moved first — refetch and "
        "retry. Setting confirm_replace_content=true acknowledges that a "
        "substantial prose body will be removed when the page app should "
        "stand alone on the page.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "source": "@Card {\\n  Text [\"hi\"]\\n}", '
        '"expected_version_hash": "sha256:abc123"}';
  }

  // ClearPageApp — see (api.v1.description).
  rpc ClearPageApp(ClearPageAppRequest) returns (ClearPageAppResponse) {
    option (api.v1.description) =
        "Removes the page-app fence and wiki.page_app frontmatter subtree "
        "from a page, leaving the page's prose untouched. The page becomes "
        "a plain markdown page. OCC via expected_version_hash as with "
        "SetPageApp.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "expected_version_hash": "sha256:abc123"}';
  }

  // WatchPageApp — see (api.v1.description).
  rpc WatchPageApp(WatchPageAppRequest) returns (stream WatchPageAppResponse) {
    option (api.v1.description) =
        "Server-streaming watch on a page's page-app program. Emits the "
        "current program and hashes on subscribe, then a new event on every "
        "accepted SetPageApp/ClearPageApp — drives the in-page renderer's "
        "hot-swap without a page reload. Not exposed as an MCP tool (the "
        "request/response tool model has no representation for an open "
        "stream); it remains available on the gRPC and Connect surfaces.";
  }
}

// PageAppStateService — see (api.v1.service_description).
service PageAppStateService {
  option (api.v1.service_description) =
      "Persistent, cross-device state for page apps, stored under the "
      "wiki.page_app_state reserved frontmatter subtree. CAS'd via "
      "state_expected_version_hash (independent of the page's markdown "
      "version hash); watchable for live updates. This is the ONLY way an "
      "page app persists state — browser localStorage is not a state "
      "path (it collides across page apps and is per-device).";

  // GetPageAppState — see (api.v1.description).
  rpc GetPageAppState(GetPageAppStateRequest) returns (GetPageAppStateResponse) {
    option (api.v1.description) =
        "Reads a page app's persisted state. Returns an empty state "
        "and empty hash when the page app has never persisted anything.";
    option (api.v1.read_only) = true;
    option (api.v1.example_request) = '{"page": "pomodoro"}';
  }

  // MergePageAppState — see (api.v1.description).
  rpc MergePageAppState(MergePageAppStateRequest) returns (MergePageAppStateResponse) {
    option (api.v1.description) =
        "Deep-merges a partial state update into the page app's persisted "
        "state. CAS: supply state_expected_version_hash from a prior "
        "GetState/MergeState/WatchState; an Aborted error means another "
        "writer moved first — refetch, re-apply, retry. Arrays are unioned, "
        "scalars replaced, nested structs deep-merged.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "state": {"completed_sessions": 3}, '
        '"state_expected_version_hash": "sha256:def456"}';
  }

  // DeletePageAppState — see (api.v1.description).
  rpc DeletePageAppState(DeletePageAppStateRequest) returns (DeletePageAppStateResponse) {
    option (api.v1.description) =
        "Deletes a page app's persisted state entirely (a reset). "
        "CAS: supply state_expected_version_hash from a prior read/watch.";
    option (api.v1.example_request) =
        '{"page": "pomodoro", "state_expected_version_hash": "sha256:def456"}';
  }

  // WatchPageAppState — see (api.v1.description).
  rpc WatchPageAppState(WatchPageAppStateRequest) returns (stream WatchPageAppStateResponse) {
    option (api.v1.description) =
        "Server-streaming watch on a page app's state. Emits the current "
        "state on subscribe, then a new event on every accepted merge or "
        "delete. Not exposed as an MCP tool (streaming); remains available "
        "on the gRPC and Connect surfaces.";
  }
}

// Request to read a page app program.
message GetPageAppRequest {
  // The page whose page app to read.
  string page = 1;
}

// Response containing a page app program and its server-stamped metadata.
message GetPageAppResponse {
  // The OpenUI Lang program source (the fence content, verbatim).
  string source = 1;
  // Server-stamped language: always "openui-lang" in this scope.
  string lang = 2;
  // Server-stamped per-accepted-write revision counter.
  int64 version = 3;
  // Hash of the program; the OCC handle for SetPageApp/ClearPageApp.
  string version_hash = 4;
  // The wiki component library version the program targets (e.g. "wiki-core@2").
  string library = 5;
  // When the page app was last written.
  google.protobuf.Timestamp updated_at = 6;
  // Who last wrote the page app.
  string updated_by = 7;
  // Whether the last write was by an automated agent.
  bool automated = 8;
}

// Request to write a page app program (the single write door).
message SetPageAppRequest {
  // The page whose page app to set.
  string page = 1;
  // The OpenUI Lang program source. Stored verbatim as the fence content.
  string source = 2;
  // OCC handle from a prior GetPageApp/SetPageApp. Empty on first write
  // to a page without a page app. Aborted on conflict.
  string expected_version_hash = 3;
  // Acknowledge removing substantial page prose so the page app can stand
  // alone. Required by the placement guard when the write would drop more
  // than 10% of at least 1KB of prose; see the error message for alternatives.
  bool confirm_replace_content = 4;
}

// Response from a page app write.
message SetPageAppResponse {
  // New server-stamped version.
  int64 version = 1;
  // New program hash; the OCC handle for the next write.
  string version_hash = 2;
  // The library version stamped on the page app.
  string library = 3;
}

// Request to remove a page app (and only the page app (prose stays) — prose stays).
message ClearPageAppRequest {
  // The page whose page app to remove.
  string page = 1;
  // OCC handle from a prior GetPageApp/SetPageApp. Aborted on conflict.
  string expected_version_hash = 2;
}

// Response from removing a page app.
message ClearPageAppResponse {}

// Request to watch a page app program.
message WatchPageAppRequest {
  // The page whose page app to watch.
  string page = 1;
}

// A page app change event.
message WatchPageAppResponse {
  enum Kind {
    // The state as it exists at subscribe time (initial snapshot).
    KIND_UNSPECIFIED = 0;
    // Initial snapshot on subscribe.
    INITIAL = 1;
    // The page app program changed (SetPageApp).
    UPDATED = 2;
    // The page app was removed (ClearPageApp).
    CLEARED = 3;
  }
  Kind kind = 1;
  // The program source after the change (empty for CLEARED).
  string source = 2;
  // The program's version after the change.
  int64 version = 3;
  // The program's hash after the change (the OCC handle).
  string version_hash = 4;
}

// Request to read page app state.
message GetPageAppStateRequest {
  // The page app whose state to read.
  string page = 1;
}

// Response containing page app state.
message GetPageAppStateResponse {
  // The persisted state struct (empty when never persisted).
  google.protobuf.Struct state = 1;
  // Hash of the state; the OCC handle for MergeState/DeleteState.
  string state_version_hash = 2;
}

// Request to merge partial state into a page app's persisted state.
message MergePageAppStateRequest {
  // The page app whose state to merge into.
  string page = 1;
  // The partial state to deep-merge (arrays union, scalars replace).
  google.protobuf.Struct state = 2;
  // OCC handle from a prior GetState/MergeState/WatchState. Required.
  string state_expected_version_hash = 3;
}

// Response from a state merge.
message MergePageAppStateResponse {
  // The full merged state.
  google.protobuf.Struct state = 1;
  // New state hash; the OCC handle for the next write.
  string state_version_hash = 2;
}

// Request to delete a page app's persisted state.
message DeletePageAppStateRequest {
  // The page app whose state to delete.
  string page = 1;
  // OCC handle from a prior read/watch. Required.
  string state_expected_version_hash = 2;
}

// Response from a state delete.
message DeletePageAppStateResponse {}

// Request to watch page app state.
message WatchPageAppStateRequest {
  // The page app whose state to watch.
  string page = 1;
}

// An page app state change event.
message WatchPageAppStateResponse {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Initial snapshot on subscribe.
    INITIAL = 1;
    // State changed (MergeState).
    MERGED = 2;
    // State deleted (DeleteState).
    DELETED = 3;
  }
  Kind kind = 1;
  // The state after the change (empty for DELETED).
  google.protobuf.Struct state = 2;
  // The state hash after the change (the OCC handle).
  string state_version_hash = 3;
}